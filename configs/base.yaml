# Benchmark protocol, identical for every model. A per-model file only names the model
# (and, if it does not fit the GPU, a smaller batch with gradient accumulation).
# Ablations later: add a config that overrides the section under study; no code changes.

protocol: benchmark          # output goes to $RUNS_ROOT/<protocol>/<run_name>/seed_<n>
model: null                  # registry name, set by the per-model config
run_name: null               # folder of the run; null = the model name (ablations name their variants)

data:
  crop_size: 256             # training crop (tiles smaller than this are padded)
  exclude_regex: []          # e.g. ["^sut_"] drops tiles whose name matches (case-insensitive)
  eval_max_side: 1024        # larger images are predicted with a sliding window
  eval_window: 512
  eval_stride: 448
  max_train_samples: 0       # 0 = all
  max_eval_samples: 0

aug:                         # one fixed setting for all models
  flip: true
  rotate90: true
  affine_p: 0.3
  affine_scale: [0.9, 1.1]
  affine_rotate: [-15, 15]
  brightness_contrast_p: 0.5
  brightness_limit: 0.15
  contrast_limit: 0.15
  hsv_p: 0.3
  blur_noise_p: 0.15
  crop: crack                # crack: crop with a crack in it when the tile has one | random: uniform random crop
  # Off in the benchmark; studied in configs/ablation/ (probabilities, 0 = not used).
  elastic_p: 0
  grid_distortion_p: 0
  perspective_p: 0
  clahe_p: 0
  gamma_p: 0
  motion_blur_p: 0
  jpeg_p: 0
  shadow_p: 0
  dropout_p: 0               # coarse dropout: the mask is cleared where the image is
  downscale_p: 0
  iso_noise_p: 0
  sharpen_p: 0
  gray_p: 0
  cutmix_p: 0                # per sample: paste a box (image and mask) from another tile of the batch

train:
  epochs: 80
  batch_size: 16             # per optimizer step: batch_size * accum_steps is the effective batch
  accum_steps: 1
  eval_batch_size: 16
  optimizer: adamw           # sgd | adam | adamw | nadam | radam | adamax | rmsprop | adagrad | lion
  optimizer_args: {}         # extra keyword arguments, e.g. {momentum: 0.9, nesterov: true} for sgd
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2           # linear warm-up, then cosine to lr * min_lr_ratio
  min_lr_ratio: 0.01
  grad_clip: 1.0
  patience: 20               # early stopping on val IoU (of the EMA weights) ...
  min_epochs: 30             # ... never before this epoch (v1 stopped pretrained models at 16-40 on noise)
  amp: true
  pretrained: true
  deterministic: true

loss:
  name: bce_dice             # bce_dice | hairline
  bce_weight: 1.0
  dice_weight: 1.0
  aux_weight: 0.0            # weight of auxiliary (deep-supervision) outputs; 0 in the benchmark

recipe:                      # tricks of the original recipes; all off in the benchmark except the EMA
  ema_decay: 0.999           # EMA of the weights (and BN statistics), used for validation and best.pt.
                             # Protocol v2: in v1 (no EMA) val IoU swung by up to 0.3 between epochs.
  encoder_lr_factor: 1.0
  deep_supervision: false
  tta: false                 # horizontal/vertical flip test-time augmentation
  cldice_warmup_epochs: 0

eval:
  tolerances: [0, 1, 2, 3, 5]
  threshold: 0.5             # used during training-time validation only
